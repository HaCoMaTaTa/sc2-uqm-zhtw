name: Verify build

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/**'
      - 'patches/**'
      - 'translation/**'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

# 注意：本 workflow 目前為「架構樣板」，實際 job 依你決定是否啟用。
# CI 完整 build MegaMod exe + Android APK 需要 GitHub Actions runner 上有 MSYS2/Android SDK，
# 首次跑會花 15+ 分鐘設 cache。若你只想快速跑「翻譯純度閘」則可只啟用第一個 job。

jobs:
  purity-check:
    name: 翻譯純度閘 (_check_zh_purity + _check_lua_templates)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run purity checks
        working-directory: pipeline
        run: |
          python _check_zh_purity.py --strict
          python _check_lua_templates.py --strict

      - name: Report
        if: always()
        run: |
          echo "純度閘檢查完成 · 若失敗請看上方 log"

